# Watchlist and detection settings. Secrets live in .env, not here.
# A blend of two sleeves so --walk-forward folds see enough trades AND multiple
# regimes: (1) a sector-diverse large-cap core for breadth/liquidity, and (2) a
# high-volatility sleeve that actually produces the sharp, high-volume flushes the
# flush-reclaim setup depends on (calm large-caps rarely do). Trim or extend freely.
tickers:
  # Mega-cap tech / comm services
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA
  - NFLX
  - CRM
  - ADBE
  - AMD
  - ORCL
  - CSCO
  # Financials
  - JPM
  - BAC
  - GS
  - V
  - MA
  # Healthcare
  - UNH
  - JNJ
  - LLY
  - ABBV
  - PFE
  # Consumer
  - WMT
  - HD
  - COST
  - MCD
  - KO
  - PG
  - NKE
  # Industrials / energy / materials
  - CAT
  - BA
  - HON
  - GE
  - XOM
  - CVX
  # High-volatility sleeve (high-beta / momentum names that flush hard)
  - PLTR
  - COIN
  - RIVN
  - HOOD
  - FOXA
  - SOFI
  - MARA
  - RIOT
  - AFRM
  - ROKU
  - DKNG
  - SNAP
  - UPST
  - CVNA
  - LCID
  - PLUG
  - ABNB
  - SHOP
  - NET
  - SNOW
  - CRWD

# Scan each timeframe independently; every timeframe fires its own alert + chart.
timeframes:
  - "1d"    # daily
  - "1wk"   # weekly (stronger, rarer signal)

# yfinance's current-period bar keeps updating until the session/week closes.
# Keep true to only ever act on fully closed bars (safe, but confirmations land
# one bar late). Set false if hermes runs comfortably after the US close and
# you want same-day confirmation.
drop_forming_bar: true

db_path: "ddbot.sqlite3" # SQLite state file (created on first run)
chart_dir: "charts"      # where confirmation chart PNGs are written

# Flush-reclaim (bear-trap) double bottom: B1 -> recovery peak (neckline) -> steep,
# high-volume flush that UNDERCUTS B1's low (B2) -> bullish reclaim above B1's low within
# reclaim_window bars = entry (below the neckline). Stop = flush low; target = neckline.
detection:
  lookback_bars: 90          # window scanned per ticker
  swing_k: 3                 # bars each side required to qualify B1 as a swing low
  min_prominence_pct: 0.05   # recovery: interim peak >= 5% above B1's low
  max_bars_between: 50       # max bars from B1 to the flush low
  require_prior_downtrend: true
  require_undercut: true     # B2 low must breach BELOW B1's low (bear-trap)
  flush_atr_window: 14       # ATR window for the steepness measure
  flush_atr_mult: 3.0        # peak->B2 drop must be >= this x ATR (near-vertical flush)
  flush_max_bars: 3          # peak->B2 must happen within this many bars
  flush_volume_factor: 1.5   # flush bar volume >= this x its recent average (capitulation)
  flush_volume_window: 20
  reclaim_window: 4          # bullish close > B1 low within this many bars of B2 = entry
  # The reclaim bar must be a clean bullish candle (fractions are of the bar's range H-L):
  reclaim_min_body_frac: 0.60        # full green bar: body >= 60% of range
  reclaim_max_upper_wick_frac: 0.15  # both shapes: upper wick <= 15% of range (no "long head")
  reclaim_min_lower_wick_frac: 0.50  # bullish pin bar / hammer: lower wick >= 50% of range
  # Exit model, set at confirmation (entry = reclaim close). An exit-model study found an ATR
  # stop + measured-move target holds out-of-sample, unlike the original flush-low/neckline exit.
  stop_mode: "atr"           # "atr" | "flush_low" | "reclaim_bar_low"
  stop_atr_window: 14
  stop_atr_mult: 3.5         # stop = entry - this x ATR when stop_mode = atr
  target_mode: "measured_move"  # "measured_move" (neckline + (neckline - stop)) | "neckline"

# Multi-timeframe confirmation: only fire a daily alert when the weekly trend agrees
# (weekly close above its SMA). Weekly alerts are not gated (they are the higher timeframe).
mtf:
  require: true
  higher_timeframe: "1wk"
  sma_window: 30          # weekly uptrend = close > 30-week SMA

# Position sizing used for the "suggested size" line in alerts and the $ backtest.
risk:
  account_equity: 10000.0    # notional account size for sizing suggestions
  risk_per_trade_pct: 0.01   # risk 1% of equity per trade
  max_position_pct: 0.25     # cap any single position at 25% of equity
